# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/secure-notes-db
spring.datasource.username=postgres
spring.datasource.password=hari@11

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App Custom Security Settings (AES & JWT)
app.security.aes-key=mySuperSecretKey12345mySuperSecret
app.security.jwt-secret=mySuperLongSecureJwtSecretKeyMustBeAtLeast256BitsLongToWorkSafelyWithHMAC
app.security.jwt-expiration-ms=86400000

# LangChain4j Groq Integration
langchain4j.groq.chat-model.api-key=your-groq-api-key-here
langchain4j.groq.chat-model.model-name=llama-3.3-70b-versatile